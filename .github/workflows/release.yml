# Builds the static binary + scratch image for amd64 and arm64 and pushes one
# multi-arch image to GHCR. Two ways to start it:
#
#   GitHub release published   -> ghcr.io/nashcom/nsh-pixelbridge:<version> and :latest,
#                                 and the binaries (with SHA-256 files) are attached
#                                 to the release. The tag must match Cargo.toml.
#   Run workflow (manual)      -> ghcr.io/nashcom/nsh-pixelbridge:edge only. No release,
#                                 no :latest, no attached binaries (they stay available
#                                 as workflow artifacts). For testing the pipeline and
#                                 for trying a build before releasing it.
#
# Each architecture is built on a NATIVE runner. Unlike the C++ projects, this
# one does not use QEMU: compiling Rust with full LTO under emulation would
# take far too long. The two single-arch images are pushed by digest and then
# joined into one manifest list.

name: Release and image

on:
  release:
    types: [published, edited]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/nashcom/nsh-pixelbridge

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: write  # push the image to GHCR

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Read version
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # For a release, the tag (v0.9.0 or 0.9.0) must match the version in Cargo.toml.
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            if [ "${TAG#v}" != "$VERSION" ]; then
              echo "ERROR: release tag '$TAG' does not match Cargo.toml version '$VERSION'" >&2
              exit 1
            fi
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Local build first (load: true): the binary is extracted from this
      # image for the release assets. Cached per architecture.
      - name: Build image (local)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          tags: nsh-pixelbridge:local
          load: true
          push: false
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Extract binary
        run: |
          mkdir -p dist
          CID=$(docker create nsh-pixelbridge:local)
          docker cp "$CID:/nsh-pixelbridge" "dist/nsh-pixelbridge-$VERSION-${{ matrix.arch }}"
          docker rm "$CID" >/dev/null
          cd dist
          sha256sum "nsh-pixelbridge-$VERSION-${{ matrix.arch }}" > "nsh-pixelbridge-$VERSION-${{ matrix.arch }}.sha256"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

      # Pushed by digest, without tags. The publish job below attaches the
      # tags to one manifest list that combines both architectures. The build
      # reuses the cache of the local build above, so nothing is recompiled.
      - name: Push image by digest
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error

  publish:
    name: Publish multi-arch image (and release assets)
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: write  # upload release assets
      packages: write  # tag the image in GHCR

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Read version
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # A release gets <version> and latest; a manual run only gets edge.
      - name: Choose image tags
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "TAG_ARGS=-t $IMAGE:$VERSION -t $IMAGE:latest" >> "$GITHUB_ENV"
            echo "MAIN_TAG=$VERSION" >> "$GITHUB_ENV"
          else
            echo "TAG_ARGS=-t $IMAGE:edge" >> "$GITHUB_ENV"
            echo "MAIN_TAG=edge" >> "$GITHUB_ENV"
          fi

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One manifest list, so "docker pull ghcr.io/nashcom/nsh-pixelbridge:latest"
      # picks the right architecture on amd64 and arm64.
      - name: Create multi-arch manifest
        run: |
          # TAG_ARGS holds one or two "-t image:tag" pairs (word splitting is intended)
          docker buildx imagetools create \
            $TAG_ARGS \
            $(printf "$IMAGE@sha256:%s " $(ls /tmp/digests))

      - name: Show manifest
        run: docker buildx imagetools inspect "$IMAGE:$MAIN_TAG"

      # Only a real release has a release to attach files to.
      - name: Upload release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/nsh-pixelbridge-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
