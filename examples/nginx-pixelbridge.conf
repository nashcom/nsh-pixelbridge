# NGINX in front of nsh-pixelbridge: TLS, access control and request limits
# live here; the service itself speaks plain HTTP only.
#
# Include inside an http {} block. Adjust names, certificates and the
# allow/deny rules -- PixelBridge has no authentication of its own.

upstream pixelbridge {
    server 127.0.0.1:8080;
    keepalive 8;
}

server {
    listen 443 ssl;
    server_name pixelbridge.example.com;

    ssl_certificate     /etc/nginx/tls/pixelbridge.crt;
    ssl_certificate_key /etc/nginx/tls/pixelbridge.key;

    # Same as PIXELBRIDGE_MAX_REQUEST_BYTES. The JSON endpoint carries base64,
    # which is about a third larger than the image, so allow a little more.
    client_max_body_size 8m;

    # Only trusted callers (the MCP bridge host, your own network).
    allow 10.0.0.0/8;
    allow 127.0.0.1;
    deny  all;

    location / {
        proxy_pass http://pixelbridge;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_read_timeout 30s;     # a bit above PIXELBRIDGE_TIMEOUT_SECONDS
        proxy_request_buffering on; # slow clients are absorbed by NGINX
    }
}
